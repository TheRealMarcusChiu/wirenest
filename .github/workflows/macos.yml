name: macOS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp into the app, such as 0.1.0
        required: false
        default: 0.1.0
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version || '0.1.0' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Packaging self-checks
        run: bash scripts/test-packaging.sh
      - name: Verify upstream signatures and write the source archive
        run: bash scripts/verify-signatures.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-sources
          path: dist/WireNest-third-party-sources.tar
          if-no-files-found: error

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
          [ "$(uname -m)" = "$ARCH" ]
      - name: Swift tests
        run: swift test
      - name: Build bundled tools from pinned sources
        run: bash scripts/build-tools.sh
      - name: Build and sign the app
        run: bash scripts/build-app.sh "$VERSION" "$GITHUB_RUN_NUMBER"
      - name: Create the DMG
        run: bash scripts/make-dmg.sh "$VERSION"
      - name: Verify the DMG
        run: bash scripts/verify-dmg.sh "dist/WireNest-$VERSION-$ARCH.dmg" "$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WireNest-${{ matrix.arch }}
          path: |
            dist/WireNest-*.dmg
            dist/WireNest-*.dmg.sha256
          if-no-files-found: error
      # Runs after the upload so a smoke failure leaves its DMG available for diagnosis.
      # A failure here still fails the run, and release.yml then publishes nothing.
      - name: Real two-tunnel smoke test
        run: sudo bash scripts/smoke-two-tunnels.sh .build/packaging/from-dmg/WireNest.app .build/packaging/smoke-peer
      # Not under sudo: the driver must have the same owner UID as the signed app, and the
      # script itself uses sudo only to install and uninstall the helper.
      - name: Real app-to-root-helper smoke test
        timeout-minutes: 10
        run: bash scripts/smoke-helper.sh .build/packaging/from-dmg/WireNest.app .build/packaging/smoke-peer
